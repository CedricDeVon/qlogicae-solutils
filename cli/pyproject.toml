[project]
name = "qlogicae-solutils"
version = "1.0.0a1"
description = "A local, OS-independent, CI/CD workflow execution tool for QLogicae projects"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
license-files = [
    "LICENSE"
]
dependencies = []
keywords = [
    "qlogicae",
    "solutils"
]
classifiers = [
    "Topic :: Utilities",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Software Distribution",
    "Topic :: System :: Systems Administration",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [
    { name = "Vaughn Cedric L. Araneta", email = "vaughncedriclipardoaraneta@gmail.com" }
]
maintainers = [
    { name = "Vaughn Cedric L. Araneta", email = "vaughncedriclipardoaraneta@gmail.com" }
]


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-timeout",
    "pybenchmark",
    "ruff",
    "mypy",
    "hatch",
    "twine",
    "memray",
    "pympler",
    "vulture",
    "bandit",
    "detect-secrets",
    "pip-audit",   
    "python-minifier"
]

[project.scripts]
qlogicae-solutils = "qlogicae_solutils.v1.__main__:main"
qlogicae-solutils-v1 = "qlogicae_solutils.v1.__main__:main"


[project.urls]
Homepage = "https://github.com/CedricDeVon/qlogicae-solutils"
Repository = "https://github.com/CedricDeVon/qlogicae-solutils"
Documentation = "https://github.com/CedricDeVon/qlogicae-solutils"
Issues = "https://github.com/CedricDeVon/qlogicae-solutils/issues"
Changelog = "https://github.com/CedricDeVon/qlogicae-solutils/releases"


[build-system]
requires = [
    "hatchling"
]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = [
    "."
]
python_files = [
    "test_*.py"
]
addopts = "-ra"


[tool.coverage.run]
source = []
branch = true


[tool.hatch.build]
include = [
    "qlogicae_solutils/**/*",
    "qlogicae_solutils/py.typed",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "test",
    ".github",
    ".gitignore",
    ".vscode",
    "requirements.txt",
    "output",
    "docs/**",
    "project/**",
]


[tool.coverage.report]
show_missing = true
skip_covered = false


[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".output",
    "output",
    ".outputs",
    "outputs",
    ".dist",
    "dist",
    ".build",
    "build",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".tox",
    ".nox",
    ".idea",
    ".vscode",
    "qlogicae_solutils/v1/_vendor",
    "qlogicae_solutils/v1/qlogicae_cliq",
    "qlogicae_solutils/v1/qlogicae_cor",
]


[tool.ruff.lint]
select = [    
    "E",
    "W", # pycodestyle    
    "F", # Pyflakes    
    "I", # isort    
    "UP", # pyupgrade    
    "B", # flake8-bugbear
    "PTH", # pathlib
]
ignore = [        
    "E731",
    "B008",
    "S607",    
    "S101", # allow assert statements    
    "S603", # allow subprocess usage
    "PLR2004", # allow magic values
]
fixable = [
    "ALL"
]
unfixable = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
skip-magic-trailing-comma = false


[tool.mypy]
files = [
    "qlogicae_solutils/v1",
]
exclude = [
    '(^|/)_vendor(/|$)',
    '__init__.py',
]
mypy_path = "qlogicae_solutils/v1"
strict = true
pretty = true
color_output = true
python_version = "3.12"
show_error_codes = true
show_error_context = true
namespace_packages = true
show_column_numbers = true
explicit_package_bases = true


[[tool.mypy.overrides]]
module = []
ignore_errors = true


[tool.vulture]
exclude = [
    
]

[tool.hatch.build.targets.wheel]
packages = ["qlogicae_solutils"]

[tool.hatch.envs.default.scripts]
v1-build-filesystem-clean = """
    python3 -c "import shutil,sys; [shutil.rmtree(p, ignore_errors=True) for p in sys.argv[1:]]" dist output
"""

v1-build-filesystem-setup = """
    python3 -c "import pathlib,sys; [pathlib.Path(p).mkdir(parents=True, exist_ok=True) for p in sys.argv[1:]]" archive output/build/release output/build/release/source output/build/release/minified output/test/unit output/test/smoke output/test/e2e output/benchmark
"""

v1-build-pre-minify = """
    python3 -c "import shutil,sys; shutil.copytree(sys.argv[1], sys.argv[2], dirs_exist_ok=True)" qlogicae_solutils output/build/release/minified/qlogicae_solutils
"""

v1-build-minify = """
    pyminify --in-place --prefer-single-line --remove-debug --remove-asserts --remove-literal-statements --remove-class-attribute-annotations output/build/release/minified
"""

v1-build-source = """
    python3 -c "import shutil,sys; shutil.copytree(sys.argv[1], sys.argv[2], dirs_exist_ok=True)" qlogicae_solutils output/build/release/source/qlogicae_solutils
"""

v1-build-pre-1-pip-package = """
    python3 -c "import shutil,sys; [shutil.rmtree(p, ignore_errors=True) for p in sys.argv[1:]]" qlogicae_solutils
"""

v1-build-pre-2-pip-package = """
    python3 -c "import shutil,sys; shutil.copytree(sys.argv[1], sys.argv[2], dirs_exist_ok=True)" output/build/release/minified/qlogicae_solutils qlogicae_solutils
"""

v1-build-pip-package = """
    hatch build
"""

v1-build-post-1-pip-package = """
    python3 -c "import shutil,sys; shutil.copytree(sys.argv[1], sys.argv[2], dirs_exist_ok=True)" dist output/build/release/dist
"""

v1-build-post-2-pip-package = """
    python3 -c "import shutil,sys; [shutil.rmtree(p, ignore_errors=True) for p in sys.argv[1:]]" qlogicae_solutils
"""

v1-build-post-3-pip-package = """
    python3 -c "import shutil,sys; shutil.copytree(sys.argv[1], sys.argv[2], dirs_exist_ok=True)" output/build/release/source/qlogicae_solutils qlogicae_solutils
"""

v1-archive-output = """
    python3 -c "import shutil,sys; shutil.copytree(sys.argv[1], sys.argv[2], dirs_exist_ok=True)" output archive/v1.0.0a1/2026-11-16T22-28-33.264746926+08-00
"""

v1-test-check-and-apply-format = """
    ruff check qlogicae_solutils/v1 --fix
"""

v1-test-check-and-apply-lint = """

"""

v1-test-run-unit = """
    
"""

v1-test-run-smoke = """
    pytest -vv test/qlogicae_solutils/v1/smoke/test_imports.py
"""

v1-test-run-e2e = """
    
"""

v1-test-check-feature-staleness = """
    vulture qlogicae_solutils 
"""

v1-test-check-dependencies = """
    pip-audit -r requirements.txt
"""

v1-test-check-hardcoded-secrets = """
    detect-secrets scan 
"""

v1-test-check-security = """
    bandit -r qlogicae_solutils
"""

v1-test-check-pip-deployment-build = """
    twine check output/build/release/dist/*
"""

v1-benchmark-create-memray-usage-import-only = """
    memray run -o output/benchmark/memory_usage/import_only.bin -m benchmark.qlogicae_solutils.v1.memory.import.usage.import_only --force
"""

v1-benchmark-view-memray-usage-import-only = """
    memray tree output/benchmark/memory_usage/import_only.bin
"""

v1-benchmark-create-memray-usage-import-and-allocate = """
    memray run -o output/benchmark/memory_usage/import_and_allocate.bin -m benchmark.qlogicae_solutils.v1.memory.import.usage.import_and_allocate --force
"""

v1-benchmark-view-memray-usage-import-and-allocate = """
    memray tree output/benchmark/memory_usage/import_and_allocate.bin
"""

v1-benchmark-short-library-import-memory-usage = """
    ./.venv/bin/python -m benchmark.qlogicae_solutils.v1.tool qlogicae_solutils.v1 --json-output output/benchmark/memory_usage/import-library.json --repetitions 10
"""

v1-deploy-build-release = """
    twine upload output/build/release/dist/* --config-file .pypirc
"""

v1-usage-install-release = """
    ./.venv/bin/python -m pip install --force-reinstall output/build/release/dist/*.whl
"""

v1-usage-uninstall-release = """
    ./.venv/bin/python -m pip uninstall -y output/build/release/dist/*.whl
"""

