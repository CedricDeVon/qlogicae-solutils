[project]
name = "qlogicae-solutils"
version = "0.0.1"
description = "A local, OS-independent, CI/CD workflow execution tool for QLogicae projects"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
license-files = [
    "LICENSE"
]
dependencies = []
keywords = [
    "qlogicae",
    "solutils"
]
classifiers = [
    "Topic :: Utilities",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Software Distribution",
    "Topic :: System :: Systems Administration",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [
    { name = "Vaughn Cedric L. Araneta", email = "vaughncedriclipardoaraneta@gmail.com" }
]
maintainers = [
    { name = "Vaughn Cedric L. Araneta", email = "vaughncedriclipardoaraneta@gmail.com" }
]


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-timeout",
    "pybenchmark",
    "ruff",
    "mypy",
    "hatch",
    "twine",
    "memray",
    "scalene",
    "pympler",
    "vulture",
    "bandit",
    "detect-secrets",
    "pip-audit",   
    "python-minifier"
]

[project.scripts]
qlogicae-solutils = "qlogicae_solutils.v1.main:main"


[project.urls]
Homepage = "https://github.com/CedricDeVon/qlogicae-solutils"
Repository = "https://github.com/CedricDeVon/qlogicae-solutils"
Documentation = "https://github.com/CedricDeVon/qlogicae-solutils"
Issues = "https://github.com/CedricDeVon/qlogicae-solutils/issues"
Changelog = "https://github.com/CedricDeVon/qlogicae-solutils/releases"


[build-system]
requires = [
    "hatchling"
]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = [
    "."
]
python_files = [
    "test_*.py"
]
addopts = "-ra"


[tool.coverage.run]
source = []
branch = true


[tool.hatch.build]
include = [
    "qlogicae_solutils/**/*",
    "qlogicae_solutils/py.typed",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "test",
    ".github",
    ".gitignore",
    ".vscode",
    "requirements.txt",
    "output",
    "docs/**",
    "project/**",
]


[tool.coverage.report]
show_missing = true
skip_covered = false


[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".output",
    "output",
    ".outputs",
    "outputs",
    ".dist",
    "dist",
    ".build",
    "build",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".tox",
    ".nox",
    ".idea",
    ".vscode"
]


[tool.ruff.lint]
select = [    
    "E",
    "W", # pycodestyle    
    "F", # Pyflakes    
    "I", # isort    
    "UP", # pyupgrade    
    "B", # flake8-bugbear
    "PTH", # pathlib
]
ignore = [        
    "E731",
    "B008",
    "S607",    
    "S101", # allow assert statements    
    "S603", # allow subprocess usage
    "PLR2004", # allow magic values
]
fixable = [
    "ALL"
]
unfixable = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
skip-magic-trailing-comma = false


[tool.mypy]
files = [
    "qlogicae_solutils/v1",
]
exclude = [
    '(^|/)_vendor(/|$)',
    '__init__.py',
]
mypy_path = "qlogicae_solutils/v1"
strict = true
pretty = true
color_output = true
python_version = "3.12"
show_error_codes = true
show_error_context = true
namespace_packages = true
show_column_numbers = true
explicit_package_bases = true


[[tool.mypy.overrides]]
module = [
    "qlogicae_solutils.v1._vendor.*",
]
ignore_errors = true


[tool.vulture]
exclude = [
    
]

[tool.hatch.build.targets.wheel]
test-check-and-apply-format = """
    ruff check qlogicae_solutils/v1 --fix
"""

test-check-and-apply-lint = """

"""

test-run-unit = """
    pytest -vv --cov --cov-branch --cov-report=term-missing --cov-report=html:\"output/test/unit/html\" --cov-report=xml:\"output/test/unit/coverage.xml\" --cov-report=json:\"output/test/unit/coverage.json\" --junitxml=\"output/test/unit/junit.xml\"
"""

test-run-smoke = """
    pytest -vv test/qlogicae_solutils/v1/smoke/test_imports.py
"""

test-run-e2e = """
    
"""

test-check-feature-staleness = """
    vulture qlogicae_solutils 
"""

test-check-dependencies = """
    pip-audit -r requirements.txt
"""

test-check-hardcoded-secrets = """
    detect-secrets scan 
"""

test-check-security = """
    bandit -r qlogicae_solutils
"""

test-check-pip-deployment-build = """
    twine check output/build/release/dist/*
"""

benchmark-create-memray-usage-import-only = """
    memray run -o output/benchmark/usage.import_only.bin -m benchmark.qlogicae_solutils.v1.memory.import.usage.import_only --force
"""

benchmark-view-memray-usage-import-only = """
    memray tree output/benchmark/usage.import_only.bin
"""

benchmark-create-memray-usage-import-and-allocate = """
    memray run -o output/benchmark/usage.import_and_allocate.bin -m benchmark.qlogicae_solutils.v1.memory.import.usage.import_and_allocate --force
"""

benchmark-view-memray-usage-import-and-allocate = """
    memray tree output/benchmark/usage.import_and_allocate.bin
"""

benchmark-short-library-import-memory-usage = """
    ./.venv/bin/python -m benchmark.qlogicae_solutils.v1.tool qlogicae_solutils.v1 --json-output output/benchmark/import-library-memory-usage.json --repetitions 10
"""

benchmark-long-experiment-import-memory-usage = """
    ./.venv/bin/python -m benchmark.qlogicae_solutils.v1.tool benchmark.qlogicae_solutils.v1.memory.import.experiment.static_import benchmark.qlogicae_solutils.v1.memory.import.experiment.old_dynamic_import benchmark.qlogicae_solutils.v1.memory.import.experiment.typeless_with_static_class_import benchmark.qlogicae_solutils.v1.memory.import.experiment.typeless_with_dynamic_class_import benchmark.qlogicae_solutils.v1.memory.import.experiment.empty_package --json-output output/benchmark/import-experiment-memory-usage.json/ --repetitions 20
"""

benchmark-long-library-import-memory-usage = """
    ./.venv/bin/python -m benchmark.qlogicae_solutils.v1.tool qlogicae_solutils.v1 qlogicae_solutils.v2 qlogicae_solutils.v1 --json-output output/benchmark/import-library-memory-usage.json --repetitions 20
"""

deploy-build-release = """
    twine upload output/build/release/dist/* --config-file .pypirc
"""

usage-install-release = """
    ./.venv/bin/python -m pip install --force-reinstall output/build/release/dist/*.whl
"""

usage-uninstall-release = """
    ./.venv/bin/python -m pip uninstall -y output/build/release/dist/*.whl
"""

