[project]
name = "qlogicae-solutils"
version = "0.0.1"
description = "A local OS-independent CI/CD tool for QLogicae projects"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
license-files = [
    "LICENSE"
]
dependencies = []
keywords = [
    "qlogicae",
    "solutils"
]
classifiers = [
    "Topic :: Utilities",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Software Distribution",
    "Topic :: System :: Systems Administration",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [
    { name = "Vaughn Cedric L. Araneta", email = "vaughncedriclipardoaraneta@gmail.com" }
]
maintainers = [
    { name = "Vaughn Cedric L. Araneta", email = "vaughncedriclipardoaraneta@gmail.com" }
]


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-timeout",
    "pybenchmark",
    "ruff",
    "mypy",
    "hatch",
    "twine",
    "memray",
    "scalene",
    "pympler",
    "vulture",
    "bandit",
    "detect-secrets",
    "pip-audit",   
    "python-minifier"
]

[project.scripts]
qlogicae-solutils = "qlogicae_solutils.v1.main:main"


[project.urls]
Homepage = "https://github.com/CedricDeVon/qlogicae-solutils"
Repository = "https://github.com/CedricDeVon/qlogicae-solutils"
Documentation = "https://github.com/CedricDeVon/qlogicae-solutils"
Issues = "https://github.com/CedricDeVon/qlogicae-solutils/issues"
Changelog = "https://github.com/CedricDeVon/qlogicae-solutils/releases"


[build-system]
requires = [
    "hatchling"
]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = [
    "."
]
python_files = [
    "test_*.py"
]
addopts = "-ra"


[tool.coverage.run]
source = []
branch = true


[tool.hatch.build]
include = [
    "qlogicae_solutils/**/*",
    "qlogicae_solutils/py.typed",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "test",
    ".github",
    ".gitignore",
    ".vscode",
    "requirements.txt",
    "output",
    "docs/**",
    "project/**",
]


[tool.coverage.report]
show_missing = true
skip_covered = false


[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".output",
    "output",
    ".outputs",
    "outputs",
    ".dist",
    "dist",
    ".build",
    "build",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".tox",
    ".nox",
    ".idea",
    ".vscode"
]


[tool.ruff.lint]
select = [    
    "E",
    "W", # pycodestyle    
    "F", # Pyflakes    
    "I", # isort    
    "UP", # pyupgrade    
    "B", # flake8-bugbear
    "PTH", # pathlib
]
ignore = [        
    "E731",
    "B008",
    "S607",    
    "S101", # allow assert statements    
    "S603", # allow subprocess usage
    "PLR2004", # allow magic values
]
fixable = [
    "ALL"
]
unfixable = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
skip-magic-trailing-comma = false


[tool.mypy]
files = [
    "qlogicae_solutils/v1",
]
exclude = [
    '(^|/)_vendor(/|$)',
    '__init__.py',
]
mypy_path = "qlogicae_solutils/v1"
strict = true
pretty = true
color_output = true
python_version = "3.12"
show_error_codes = true
show_error_context = true
namespace_packages = true
show_column_numbers = true
explicit_package_bases = true


[[tool.mypy.overrides]]
module = [
    "qlogicae_solutils.v1._vendor.*",
]
ignore_errors = true


[tool.vulture]
exclude = [
    
]

[tool.hatch.build.targets.wheel]

